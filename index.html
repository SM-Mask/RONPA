<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RONPA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 12px 0 0;
      color: #ddd;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    #createTopicButton {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-weight: bold;
      margin-bottom: 25px;
    }

    #createArea {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    #topicInput {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #saveTopicButton {
      margin-top: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    .sort-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sort-button {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      background: white;
      font-weight: bold;
    }

    .sort-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .topic-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.07);
    }

    .topic-title {
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .topic-title:hover {
      text-decoration: underline;
    }

    .topic-info {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .vote-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .vote-button {
      flex: 1;
      padding: 13px 8px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-weight: bold;
    }

    .vote-button:hover {
      background: #f3f3f3;
    }

    .latest-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #555;
    }

    .latest-comment {
      background: #f6f6f6;
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 7px;
      font-size: 14px;
    }

    .comment-side {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .open-hint {
      color: #777;
      font-size: 13px;
      margin-top: 12px;
      cursor: pointer;
    }

    .discussion-area {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 2px solid #eee;
    }

    .discussion-area.open {
      display: block;
    }

    .side-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .side-button {
      flex: 1;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 9px;
      background: white;
    }

    .side-button.selected {
      border-color: #222;
      background: #f2f2f2;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .post-button {
      margin-top: 9px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    .all-comments-title {
      margin-top: 25px;
      font-weight: bold;
    }

    .all-comment {
      background: #f3f3f3;
      border-radius: 9px;
      padding: 12px;
      margin-top: 9px;
      word-break: break-word;
    }

    .empty {
      color: #777;
    }

    .message {
      font-size: 14px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .vote-row {
        gap: 6px;
      }

      .vote-button {
        font-size: 14px;
      }

      .sort-button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 RONPA</h1>
  <p>みんなの意見で議論する場所</p>
</header>

<main>

  <button id="createTopicButton">
    ＋ 新しい議題を作る
  </button>

  <div id="createArea">

    <h2>新しい議題</h2>

    <input
      id="topicInput"
      maxlength="100"
      placeholder="例：AIは人間の仕事を奪うと思う？"
    >

    <button id="saveTopicButton">
      議題を作成
    </button>

    <div id="createMessage" class="message"></div>

  </div>

  <h2>議題一覧</h2>

  <div class="sort-buttons">

    <button
      id="popularButton"
      class="sort-button active"
    >
      🔥 人気順
    </button>

    <button
      id="newButton"
      class="sort-button"
    >
      🆕 新着順
    </button>

  </div>

  <div id="topics">
    読み込み中...
  </div>

</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyDGjwQ_wFFkhJynJIbgzKFpfs0rpcMWk8o",

  authDomain:
  "ronpa-7b4ae.firebaseapp.com",

  projectId:
  "ronpa-7b4ae",

  storageBucket:
  "ronpa-7b4ae.firebasestorage.app",

  messagingSenderId:
  "882612778855",

  appId:
  "1:882612778855:web:90fe4308ab25ac367761c2",

  measurementId:
  "G-VC028K73B3"
};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


const topicsElement =
document.getElementById("topics");

const createTopicButton =
document.getElementById("createTopicButton");

const createArea =
document.getElementById("createArea");

const topicInput =
document.getElementById("topicInput");

const saveTopicButton =
document.getElementById("saveTopicButton");

const createMessage =
document.getElementById("createMessage");

const popularButton =
document.getElementById("popularButton");

const newButton =
document.getElementById("newButton");


const topicData =
new Map();

const voteUnsubscribers =
new Map();

const commentUnsubscribers =
new Map();


let openedTopicId =
null;

let sortMode =
"popular";


// --------------------
// 人気順 / 新着順
// --------------------

popularButton.addEventListener(
"click",
() => {

  sortMode =
  "popular";

  popularButton.classList.add(
    "active"
  );

  newButton.classList.remove(
    "active"
  );

  renderTopics();

});


newButton.addEventListener(
"click",
() => {

  sortMode =
  "new";

  newButton.classList.add(
    "active"
  );

  popularButton.classList.remove(
    "active"
  );

  renderTopics();

});


// --------------------
// 議題作成欄
// --------------------

createTopicButton.addEventListener(
"click",
() => {

  createArea.style.display =
    createArea.style.display === "block"
      ? "none"
      : "block";

});


// --------------------
// 新しい議題を作成
// --------------------

saveTopicButton.addEventListener(
"click",
async () => {

  const title =
  topicInput.value.trim();


  if (!title) {

    alert(
      "議題を入力してください"
    );

    return;

  }


  saveTopicButton.disabled =
  true;

  createMessage.textContent =
  "作成中...";


  try {

    await addDoc(
      collection(
        db,
        "topics"
      ),
      {
        title,
        createdAt:
        serverTimestamp()
      }
    );


    topicInput.value =
    "";

    createArea.style.display =
    "none";

    createMessage.textContent =
    "";

  }
  catch(error) {

    console.error(error);

    createMessage.textContent =
    "議題を作成できませんでした。";

  }
  finally {

    saveTopicButton.disabled =
    false;

  }

});


// --------------------
// 議題一覧を監視
// --------------------

onSnapshot(
collection(db, "topics"),
snapshot => {

  const currentIds =
  new Set();


  snapshot.forEach(
  topicDoc => {

    const id =
    topicDoc.id;

    const data =
    topicDoc.data();


    currentIds.add(id);


    if (!topicData.has(id)) {

      topicData.set(
        id,
        {
          id,
          title:
          data.title,

          createdAt:
          data.createdAt,

          agree: 0,

          disagree: 0,

          comments: []
        }
      );


      watchVotes(id);

      watchComments(id);

    }
    else {

      const topic =
      topicData.get(id);

      topic.title =
      data.title;

      topic.createdAt =
      data.createdAt;

    }

  });


  for (
    const id
    of topicData.keys()
  ) {

    if (!currentIds.has(id)) {

      topicData.delete(id);

    }

  }


  renderTopics();

});


// --------------------
// 投票を監視
// --------------------

function watchVotes(
  topicId
) {

  if (
    voteUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const unsubscribe =
  onSnapshot(
    collection(
      db,
      "topics",
      topicId,
      "votes"
    ),
    snapshot => {

      let agree = 0;

      let disagree = 0;


      snapshot.forEach(
      voteDoc => {

        const vote =
        voteDoc.data();


        if (
          vote.side ===
          "agree"
        ) {

          agree++;

        }


        if (
          vote.side ===
          "disagree"
        ) {

          disagree++;

        }

      });


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) return;


      topic.agree =
      agree;

      topic.disagree =
      disagree;


      renderTopics();

    }
  );


  voteUnsubscribers.set(
    topicId,
    unsubscribe
  );

}


// --------------------
// コメントを監視
// --------------------

function watchComments(
  topicId
) {

  if (
    commentUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const commentsQuery =
  query(
    collection(
      db,
      "topics",
      topicId,
      "comments"
    ),

    orderBy(
      "createdAt",
      "desc"
    )
  );


  const unsubscribe =
  onSnapshot(
    commentsQuery,
    snapshot => {

      const comments =
      [];


      snapshot.forEach(
      commentDoc => {

        comments.push(
          {
            id:
            commentDoc.id,

            ...commentDoc.data()
          }
        );

      });


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) return;


      topic.comments =
      comments;


      renderTopics();

    }
  );


  commentUnsubscribers.set(
    topicId,
    unsubscribe
  );

}


// --------------------
// 一覧表示
// --------------------

function renderTopics() {

  const list =
  Array.from(
    topicData.values()
  );


  if (
    sortMode ===
    "popular"
  ) {

    list.sort(
      (a, b) => {

        const scoreA =
          a.agree +
          a.disagree +
          a.comments.length * 3;

        const scoreB =
          b.agree +
          b.disagree +
          b.comments.length * 3;


        return (
          scoreB -
          scoreA
        );

      }
    );

  }
  else {

    list.sort(
      (a, b) => {

        const timeA =
          a.createdAt?.seconds
          || 0;

        const timeB =
          b.createdAt?.seconds
          || 0;


        return (
          timeB -
          timeA
        );

      }
    );

  }


  topicsElement.innerHTML =
  "";


  if (
    list.length === 0
  ) {

    topicsElement.innerHTML =
    '<p class="empty">まだ議題がありません。</p>';

    return;

  }


  list.forEach(
  (topic, index) => {

    const card =
    document.createElement(
      "div"
    );

    card.className =
    "topic-card";


    // ----------------
    // タイトル
    // ----------------

    const title =
    document.createElement(
      "div"
    );

    title.className =
    "topic-title";

    title.textContent =
    `${index + 1}. ${topic.title}`;


    title.addEventListener(
      "click",
      () => {

        if (
          openedTopicId ===
          topic.id
        ) {

          openedTopicId =
          null;

        }
        else {

          openedTopicId =
          topic.id;

        }


        renderTopics();

      }
    );


    // ----------------
    // 人気度
    // ----------------

    const score =
      topic.agree +
      topic.disagree +
      topic.comments.length * 3;


    const info =
    document.createElement(
      "div"
    );

    info.className =
    "topic-info";


    if (
      sortMode ===
      "popular"
    ) {

      info.textContent =
      `🔥 人気度 ${score}`;

    }
    else {

      info.textContent =
      "🆕 新着";

    }


    // ----------------
    // 投票
    // ----------------

    const voteRow =
    document.createElement(
      "div"
    );

    voteRow.className =
    "vote-row";


    const agreeButton =
    document.createElement(
      "button"
    );

    agreeButton.className =
    "vote-button";

    agreeButton.textContent =
    `👍 賛成 ${topic.agree}`;


    agreeButton.addEventListener(
      "click",
      async event => {

        event.stopPropagation();

        await vote(
          topic.id,
          "agree"
        );

      }
    );


    const disagreeButton =
    document.createElement(
      "button"
    );

    disagreeButton.className =
    "vote-button";

    disagreeButton.textContent =
    `👎 反対 ${topic.disagree}`;


    disagreeButton.addEventListener(
      "click",
      async event => {

        event.stopPropagation();

        await vote(
          topic.id,
          "disagree"
        );

      }
    );


    voteRow.appendChild(
      agreeButton
    );

    voteRow.appendChild(
      disagreeButton
    );


    // ----------------
    // 最新コメント
    // ----------------

    const latestTitle =
    document.createElement(
      "div"
    );

    latestTitle.className =
    "latest-title";

    latestTitle.textContent =
    `💬 最新のコメント（${topic.comments.length}件）`;


    const latestArea =
    document.createElement(
      "div"
    );


    const latestComments =
    topic.comments.slice(
      0,
      3
    );


    if (
      latestComments.length ===
      0
    ) {

      latestArea.innerHTML =
      '<div class="empty">まだコメントはありません。</div>';

    }
    else {

      latestComments.forEach(
      comment => {

        const box =
        document.createElement(
          "div"
        );

        box.className =
        "latest-comment";


        const side =
        document.createElement(
          "div"
        );

        side.className =
        "comment-side";


        side.textContent =
          comment.side ===
          "agree"
          ? "👍 賛成"
          : "👎 反対";


        const text =
        document.createElement(
          "div"
        );

        text.textContent =
        comment.text;


        box.appendChild(
          side
        );

        box.appendChild(
          text
        );


        latestArea.appendChild(
          box
        );

      });

    }


    // ----------------
    // 展開案内
    // ----------------

    const hint =
    document.createElement(
      "div"
    );

    hint.className =
    "open-hint";


    hint.textContent =
      openedTopicId ===
      topic.id
      ? "▲ 議題を閉じる"
      : "▼ 議題を押すとコメントできます";


    hint.addEventListener(
      "click",
      () => {

        if (
          openedTopicId ===
          topic.id
        ) {

          openedTopicId =
          null;

        }
        else {

          openedTopicId =
          topic.id;

        }


        renderTopics();

      }
    );


    // ----------------
    // コメント欄
    // ----------------

    const discussion =
    document.createElement(
      "div"
    );

    discussion.className =
    "discussion-area";


    if (
      openedTopicId ===
      topic.id
    ) {

      discussion.classList.add(
        "open"
      );


      buildDiscussionArea(
        discussion,
        topic
      );

    }


    card.appendChild(
      title
    );

    card.appendChild(
      info
    );

    card.appendChild(
      voteRow
    );

    card.appendChild(
      latestTitle
    );

    card.appendChild(
      latestArea
    );

    card.appendChild(
      hint
    );

    card.appendChild(
      discussion
    );


    topicsElement.appendChild(
      card
    );

  });

}


// --------------------
// 投票
// --------------------

async function vote(
  topicId,
  side
) {

  try {

    await addDoc(
      collection(
        db,
        "topics",
        topicId,
        "votes"
      ),
      {
        side,

        createdAt:
        serverTimestamp()
      }
    );

  }
  catch(error) {

    console.error(error);

    alert(
      "投票できませんでした。"
    );

  }

}


// --------------------
// コメント欄
// --------------------

function buildDiscussionArea(
  area,
  topic
) {

  const heading =
  document.createElement(
    "h3"
  );

  heading.textContent =
  "意見を書く";


  let selectedSide =
  "";


  const sideButtons =
  document.createElement(
    "div"
  );

  sideButtons.className =
  "side-buttons";


  const agree =
  document.createElement(
    "button"
  );

  agree.className =
  "side-button";

  agree.textContent =
  "👍 賛成";


  const disagree =
  document.createElement(
    "button"
  );

  disagree.className =
  "side-button";

  disagree.textContent =
  "👎 反対";


  agree.addEventListener(
    "click",
    () => {

      selectedSide =
      "agree";


      agree.classList.add(
        "selected"
      );


      disagree.classList.remove(
        "selected"
      );

    }
  );


  disagree.addEventListener(
    "click",
    () => {

      selectedSide =
      "disagree";


      disagree.classList.add(
        "selected"
      );


      agree.classList.remove(
        "selected"
      );

    }
  );


  sideButtons.appendChild(
    agree
  );

  sideButtons.appendChild(
    disagree
  );


  const textarea =
  document.createElement(
    "textarea"
  );

  textarea.maxLength =
  500;

  textarea.placeholder =
  "あなたの意見を書いてください";


  const post =
  document.createElement(
    "button"
  );

  post.className =
  "post-button";

  post.textContent =
  "投稿する";


  const message =
  document.createElement(
    "div"
  );

  message.className =
  "message";


  post.addEventListener(
    "click",
    async () => {

      const text =
      textarea.value.trim();


      if (
        !selectedSide
      ) {

        alert(
          "賛成か反対を選んでください"
        );

        return;

      }


      if (!text) {

        alert(
          "意見を書いてください"
        );

        return;

      }


      post.disabled =
      true;

      message.textContent =
      "投稿中...";


      try {

        await addDoc(
          collection(
            db,
            "topics",
            topic.id,
            "comments"
          ),
          {
            text,

            side:
            selectedSide,

            createdAt:
            serverTimestamp()
          }
        );


        textarea.value =
        "";

        selectedSide =
        "";


        agree.classList.remove(
          "selected"
        );

        disagree.classList.remove(
          "selected"
        );


        message.textContent =
        "投稿しました！";

      }
      catch(error) {

        console.error(error);

        message.textContent =
        "投稿できませんでした。";

      }
      finally {

        post.disabled =
        false;

      }

    }
  );


  const allTitle =
  document.createElement(
    "div"
  );

  allTitle.className =
  "all-comments-title";

  allTitle.textContent =
  `みんなの意見（${topic.comments.length}件）`;


  const allComments =
  document.createElement(
    "div"
  );


  if (
    topic.comments.length ===
    0
  ) {

    allComments.innerHTML =
    '<p class="empty">まだ意見はありません。</p>';

  }
  else {

    topic.comments.forEach(
    comment => {

      const box =
      document.createElement(
        "div"
      );

      box.className =
      "all-comment";


      const side =
      document.createElement(
        "div"
      );

      side.className =
      "comment-side";


      side.textContent =
        comment.side ===
        "agree"
        ? "👍 賛成"
        : "👎 反対";


      const text =
      document.createElement(
        "div"
      );

      text.textContent =
      comment.text;


      box.appendChild(
        side
      );

      box.appendChild(
        text
      );


      allComments.appendChild(
        box
      );

    });

  }


  area.appendChild(
    heading
  );

  area.appendChild(
    sideButtons
  );

  area.appendChild(
    textarea
  );

  area.appendChild(
    post
  );

  area.appendChild(
    message
  );

  area.appendChild(
    allTitle
  );

  area.appendChild(
    allComments
  );

}

</script>

</body>
</html>
