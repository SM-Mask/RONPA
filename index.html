<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RONPA</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    header {
      background: #222;
      color: white;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 100px;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
    }

    .side-buttons {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .side-button {
      flex: 1;
      padding: 14px;
      cursor: pointer;
      border: 2px solid #ccc;
      background: white;
      border-radius: 8px;
      font-size: 16px;
    }

    .side-button.selected {
      border-color: #222;
      font-weight: bold;
    }

    #postButton {
      margin-top: 10px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    .comment {
      background: #eee;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      word-break: break-word;
    }

    .side-label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 RONPA</h1>
  <p>自由に意見を書いてみよう</p>
</header>

<main>

  <h2>今日の議題</h2>
  <h3>AIは人間の仕事を奪うと思う？</h3>

  <div class="side-buttons">
    <button class="side-button" id="agreeButton">
      👍 賛成
    </button>

    <button class="side-button" id="disagreeButton">
      👎 反対
    </button>
  </div>

  <textarea
    id="comment"
    maxlength="500"
    placeholder="あなたの意見を書いてください"
  ></textarea>

  <button id="postButton">投稿する</button>

  <div id="status"></div>

  <h2>みんなの意見</h2>

  <div id="comments"></div>

</main>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGjwQ_wFFkhJynJIbgzKFpfs0rpcMWk8o",
    authDomain: "ronpa-7b4ae.firebaseapp.com",
    projectId: "ronpa-7b4ae",
    storageBucket: "ronpa-7b4ae.firebasestorage.app",
    messagingSenderId: "882612778855",
    appId: "1:882612778855:web:90fe4308ab25ac367761c2",
    measurementId: "G-VC028K73B3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById("comment");
  const postButton = document.getElementById("postButton");
  const comments = document.getElementById("comments");
  const status = document.getElementById("status");

  const agreeButton = document.getElementById("agreeButton");
  const disagreeButton = document.getElementById("disagreeButton");

  let selectedSide = "";

  agreeButton.addEventListener("click", () => {
    selectedSide = "agree";

    agreeButton.classList.add("selected");
    disagreeButton.classList.remove("selected");
  });

  disagreeButton.addEventListener("click", () => {
    selectedSide = "disagree";

    disagreeButton.classList.add("selected");
    agreeButton.classList.remove("selected");
  });

  postButton.addEventListener("click", async () => {

    const text = input.value.trim();

    if (selectedSide === "") {
      alert("賛成か反対を選んでください");
      return;
    }

    if (text === "") {
      alert("意見を書いてください");
      return;
    }

    postButton.disabled = true;
    status.textContent = "投稿中...";

    try {

      await addDoc(collection(db, "comments"), {
        text: text,
        side: selectedSide,
        createdAt: serverTimestamp()
      });

      input.value = "";
      selectedSide = "";

      agreeButton.classList.remove("selected");
      disagreeButton.classList.remove("selected");

      status.textContent = "投稿しました！";

    } catch (error) {

      console.error(error);
      status.textContent = "投稿に失敗しました。";

    } finally {

      postButton.disabled = false;

    }
  });

  const commentsQuery = query(
    collection(db, "comments"),
    orderBy("createdAt", "desc")
  );

  onSnapshot(
    commentsQuery,
    (snapshot) => {

      comments.innerHTML = "";

      snapshot.forEach((doc) => {

        const data = doc.data();

        const comment = document.createElement("div");
        comment.className = "comment";

        const label = document.createElement("div");
        label.className = "side-label";

        if (data.side === "agree") {
          label.textContent = "👍 賛成";
        } else if (data.side === "disagree") {
          label.textContent = "👎 反対";
        } else {
          label.textContent = "💬 意見";
        }

        const text = document.createElement("div");
        text.textContent = data.text;

        comment.appendChild(label);
        comment.appendChild(text);

        comments.appendChild(comment);
      });

    },
    (error) => {

      console.error(error);
      status.textContent = "コメントの読み込みに失敗しました。";

    }
  );

</script>

</body>
</html>
