const firebaseConfig = {

  apiKey:
  "AIzaSyDGjwQ_wFFkhJynJIbgzKFpfs0rpcMWk8o",

  authDomain:
  "ronpa-7b4ae.firebaseapp.com",

  projectId:
  "ronpa-7b4ae",

  storageBucket:
  "ronpa-7b4ae.firebasestorage.app",

  messagingSenderId:
  "882612778855",

  appId:
  "1:882612778855:web:90fe4308ab25ac367761c2",

  measurementId:
  "G-VC028K73B3"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const BASE_URL =
"https://sm-mask.github.io/RONPA/";


const topicsElement =
document.getElementById("topics");

const intro =
document.getElementById("intro");

const listControls =
document.getElementById("listControls");

const backButton =
document.getElementById("backButton");

const createTopicButton =
document.getElementById("createTopicButton");

const createArea =
document.getElementById("createArea");

const topicInput =
document.getElementById("topicInput");

const saveTopicButton =
document.getElementById("saveTopicButton");

const createMessage =
document.getElementById("createMessage");

const popularButton =
document.getElementById("popularButton");

const newButton =
document.getElementById("newButton");

const logo =
document.getElementById("logo");


const topicData =
new Map();


const voteUnsubscribers =
new Map();


const commentUnsubscribers =
new Map();


let sortMode =
"popular";


let routeTopicId =
getTopicIdFromUrl();



function getTopicIdFromUrl() {

  const params =
  new URLSearchParams(
    window.location.search
  );

  return params.get(
    "topic"
  );

}



function openHome() {

  routeTopicId =
  null;

  history.pushState(
    {},
    "",
    BASE_URL
  );

  resetSeo();

  renderTopics();

  window.scrollTo(
    0,
    0
  );

}



function openTopic(
  topicId
) {

  routeTopicId =
  topicId;


  const url =
  `${BASE_URL}?topic=${encodeURIComponent(topicId)}`;


  history.pushState(
    {},
    "",
    url
  );


  renderTopics();


  window.scrollTo(
    0,
    0
  );

}



window.addEventListener(
"popstate",
() => {

  routeTopicId =
  getTopicIdFromUrl();

  renderTopics();

});



logo.addEventListener(
"click",
openHome
);


backButton.addEventListener(
"click",
openHome
);



function resetSeo() {

  document.title =
  "RONPA｜みんなで議論・討論できる意見交換サイト";


  const description =
  "RONPAは、気になる議題について賛成・反対に投票し、みんなで自由に意見交換できる議論・討論サイトです。";


  document
  .getElementById(
    "metaDescription"
  )
  .setAttribute(
    "content",
    description
  );


  document
  .getElementById(
    "canonical"
  )
  .setAttribute(
    "href",
    BASE_URL
  );


  document
  .getElementById(
    "ogTitle"
  )
  .setAttribute(
    "content",
    document.title
  );


  document
  .getElementById(
    "ogDescription"
  )
  .setAttribute(
    "content",
    description
  );


  document
  .getElementById(
    "ogUrl"
  )
  .setAttribute(
    "content",
    BASE_URL
  );


  document
  .getElementById(
    "twitterTitle"
  )
  .setAttribute(
    "content",
    document.title
  );


  document
  .getElementById(
    "twitterDescription"
  )
  .setAttribute(
    "content",
    description
  );


  document
  .getElementById(
    "structuredData"
  )
  .textContent =
  JSON.stringify({

    "@context":
    "https://schema.org",

    "@type":
    "WebSite",

    "name":
    "RONPA",

    "url":
    BASE_URL

  });

}



function setTopicSeo(
  topic
) {

  const url =
  `${BASE_URL}?topic=${encodeURIComponent(topic.id)}`;


  const title =
  `${topic.title}｜RONPA`;


  const description =
  `${topic.title}について賛成・反対に投票し、みんなの意見を読んで議論できます。RONPAの意見交換ページです。`;


  document.title =
  title;


  document
  .getElementById(
    "metaDescription"
  )
  .setAttribute(
    "content",
    description
  );


  document
  .getElementById(
    "canonical"
  )
  .setAttribute(
    "href",
    url
  );


  document
  .getElementById(
    "ogTitle"
  )
  .setAttribute(
    "content",
    title
  );


  document
  .getElementById(
    "ogDescription"
  )
  .setAttribute(
    "content",
    description
  );


  document
  .getElementById(
    "ogUrl"
  )
  .setAttribute(
    "content",
    url
  );


  document
  .getElementById(
    "twitterTitle"
  )
  .setAttribute(
    "content",
    title
  );


  document
  .getElementById(
    "twitterDescription"
  )
  .setAttribute(
    "content",
    description
  );


  const date =
  topic.createdAt?.toDate
  ?
  topic.createdAt.toDate().toISOString()
  :
  undefined;


  const schema = {

    "@context":
    "https://schema.org",

    "@type":
    "DiscussionForumPosting",

    "headline":
    topic.title,

    "url":
    url,

    "commentCount":
    topic.comments.length

  };


  if (date) {

    schema.datePublished =
    date;

  }


  document
  .getElementById(
    "structuredData"
  )
  .textContent =
  JSON.stringify(schema);

}



popularButton.addEventListener(
"click",
() => {

  sortMode =
  "popular";


  popularButton
  .classList
  .add(
    "active"
  );


  newButton
  .classList
  .remove(
    "active"
  );


  renderTopics();

});



newButton.addEventListener(
"click",
() => {

  sortMode =
  "new";


  newButton
  .classList
  .add(
    "active"
  );


  popularButton
  .classList
  .remove(
    "active"
  );


  renderTopics();

});



createTopicButton.addEventListener(
"click",
() => {

  createArea.style.display =
  createArea.style.display
  ===
  "block"
  ?
  "none"
  :
  "block";

});



saveTopicButton.addEventListener(
"click",
async () => {

  const title =
  topicInput
  .value
  .trim();


  if (!title) {

    alert(
      "議題を入力してください"
    );

    return;

  }


  saveTopicButton.disabled =
  true;


  createMessage.textContent =
  "作成中...";


  try {

    await addDoc(

      collection(
        db,
        "topics"
      ),

      {

        title,

        createdAt:
        serverTimestamp()

      }

    );


    topicInput.value =
    "";


    createArea.style.display =
    "none";


    createMessage.textContent =
    "";

  }
  catch(error) {

    console.error(
      error
    );


    createMessage.textContent =
    "議題を作成できませんでした。";

  }
  finally {

    saveTopicButton.disabled =
    false;

  }

});



onSnapshot(

collection(
  db,
  "topics"
),

snapshot => {


  const currentIds =
  new Set();


  snapshot.forEach(
  topicDoc => {


    const id =
    topicDoc.id;


    const data =
    topicDoc.data();


    currentIds.add(
      id
    );


    if (
      !topicData.has(
        id
      )
    ) {

      topicData.set(

        id,

        {

          id,

          title:
          data.title,

          createdAt:
          data.createdAt,

          agree:
          0,

          disagree:
          0,

          comments:
          []

        }

      );


      watchVotes(
        id
      );


      watchComments(
        id
      );

    }
    else {

      const topic =
      topicData.get(
        id
      );


      topic.title =
      data.title;


      topic.createdAt =
      data.createdAt;

    }

  });


  for (
    const id
    of topicData.keys()
  ) {

    if (
      !currentIds.has(
        id
      )
    ) {

      topicData.delete(
        id
      );

    }

  }


  renderTopics();

});



function watchVotes(
  topicId
) {

  if (
    voteUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const unsubscribe =
  onSnapshot(

    collection(

      db,

      "topics",

      topicId,

      "votes"

    ),

    snapshot => {


      let agree =
      0;


      let disagree =
      0;


      snapshot.forEach(
      voteDoc => {


        const vote =
        voteDoc.data();


        if (
          vote.side ===
          "agree"
        ) {

          agree++;

        }


        if (
          vote.side ===
          "disagree"
        ) {

          disagree++;

        }

      });


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) {

        return;

      }


      topic.agree =
      agree;


      topic.disagree =
      disagree;


      renderTopics();

    }

  );


  voteUnsubscribers.set(
    topicId,
    unsubscribe
  );

}



function watchComments(
  topicId
) {

  if (
    commentUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const commentsQuery =
  query(

    collection(

      db,

      "topics",

      topicId,

      "comments"

    ),

    orderBy(
      "createdAt",
      "desc"
    )

  );


  const unsubscribe =
  onSnapshot(

    commentsQuery,

    snapshot => {


      const comments =
      [];


      snapshot.forEach(
      commentDoc => {


        comments.push({

          id:
          commentDoc.id,

          ...commentDoc.data()

        });

      });


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) {

        return;

      }


      topic.comments =
      comments;


      renderTopics();

    }

  );


  commentUnsubscribers.set(
    topicId,
    unsubscribe
  );

}



function renderTopics() {

  let list =
  Array.from(
    topicData.values()
  );


  if (routeTopicId) {

    const selected =
    topicData.get(
      routeTopicId
    );


    intro.style.display =
    "none";


    listControls.style.display =
    "none";


    createTopicButton.style.display =
    "none";


    createArea.style.display =
    "none";


    backButton.style.display =
    "inline-block";


    if (selected) {

      list =
      [selected];


      setTopicSeo(
        selected
      );

    }
    else {

      topicsElement.textContent =
      "議題を読み込み中...";

      return;

    }

  }
  else {

    intro.style.display =
    "block";


    listControls.style.display =
    "block";


    createTopicButton.style.display =
    "block";


    backButton.style.display =
    "none";


    resetSeo();


    if (
      sortMode ===
      "popular"
    ) {

      list.sort(
        (a, b) => {


          const scoreA =
          a.agree
          +
          a.disagree
          +
          a.comments.length
          *
          3;


          const scoreB =
          b.agree
          +
          b.disagree
          +
          b.comments.length
          *
          3;


          return (
            scoreB
            -
            scoreA
          );

        }
      );

    }
    else {

      list.sort(
        (a, b) => {


          const timeA =
          a.createdAt?.seconds
          ||
          0;


          const timeB =
          b.createdAt?.seconds
          ||
          0;


          return (
            timeB
            -
            timeA
          );

        }
      );

    }

  }


  topicsElement.textContent =
  "";


  if (
    list.length ===
    0
  ) {

    const empty =
    document.createElement(
      "p"
    );


    empty.className =
    "empty";


    empty.textContent =
    "まだ議題がありません。";


    topicsElement.appendChild(
      empty
    );


    return;

  }


  list.forEach(
  (topic, index) => {


    const card =
    document.createElement(
      "article"
    );


    card.className =
    "topic-card";


    const title =
    document.createElement(
      "h2"
    );


    title.className =
    "topic-title";


    if (routeTopicId) {

      title.textContent =
      topic.title;

    }
    else {

      title.textContent =
      `${index + 1}. ${topic.title}`;

    }


    title.addEventListener(
      "click",
      () => {

        if (
          !routeTopicId
        ) {

          openTopic(
            topic.id
          );

        }

      }
    );


    const score =
    topic.agree
    +
    topic.disagree
    +
    topic.comments.length
    *
    3;


    const info =
    document.createElement(
      "div"
    );


    info.className =
    "topic-info";


    info.textContent =
    `🔥 人気度 ${score}`;


    const voteRow =
    document.createElement(
      "div"
    );


    voteRow.className =
    "vote-row";


    const agreeButton =
    document.createElement(
      "button"
    );


    agreeButton.className =
    "vote-button";


    agreeButton.textContent =
    `👍 賛成 ${topic.agree}`;


    agreeButton.addEventListener(
      "click",
      async () => {

        await vote(
          topic.id,
          "agree"
        );

      }
    );


    const disagreeButton =
    document.createElement(
      "button"
    );


    disagreeButton.className =
    "vote-button";


    disagreeButton.textContent =
    `👎 反対 ${topic.disagree}`;


    disagreeButton.addEventListener(
      "click",
      async () => {

        await vote(
          topic.id,
          "disagree"
        );

      }
    );


    voteRow.appendChild(
      agreeButton
    );


    voteRow.appendChild(
      disagreeButton
    );


    const latestTitle =
    document.createElement(
      "div"
    );


    latestTitle.className =
    "latest-title";


    latestTitle.textContent =
    `💬 コメント（${topic.comments.length}件）`;


    const latestArea =
    document.createElement(
      "div"
    );


    const displayedComments =
    routeTopicId
    ?
    topic.comments
    :
    topic.comments.slice(
      0,
      3
    );


    if (
      displayedComments.length ===
      0
    ) {

      const empty =
      document.createElement(
        "div"
      );


      empty.className =
      "empty";


      empty.textContent =
      "まだコメントはありません。";


      latestArea.appendChild(
        empty
      );

    }
    else {

      displayedComments.forEach(
      comment => {


        const box =
        document.createElement(
          "div"
        );


        box.className =
        "latest-comment";


        const side =
        document.createElement(
          "div"
        );


        side.className =
        "comment-side";


        side.textContent =
        comment.side ===
        "agree"
        ?
        "👍 賛成"
        :
        "👎 反対";


        const text =
        document.createElement(
          "div"
        );


        text.textContent =
        comment.text;


        box.appendChild(
          side
        );


        box.appendChild(
          text
        );


        latestArea.appendChild(
          box
        );

      });

    }


    card.appendChild(
      title
    );


    card.appendChild(
      info
    );


    card.appendChild(
      voteRow
    );


    card.appendChild(
      latestTitle
    );


    card.appendChild(
      latestArea
    );


    if (
      routeTopicId
    ) {

      const discussion =
      document.createElement(
        "div"
      );


      discussion.className =
      "discussion-area open";


      buildDiscussionArea(
        discussion,
        topic
      );


      card.appendChild(
        discussion
      );


      const shareArea =
      document.createElement(
        "div"
      );


      shareArea.className =
      "share-area";


      const shareTitle =
      document.createElement(
        "p"
      );


      shareTitle.className =
      "share-title";


      shareTitle.textContent =
      "この議題をみんなに聞いてみよう";


      const topicUrl =
      `${BASE_URL}?topic=${encodeURIComponent(topic.id)}`;


      const shareText =
      `「${topic.title}」\nあなたは賛成？反対？\n👍 賛成 ${topic.agree} / 👎 反対 ${topic.disagree}\n#RONPA`;


      const xShareButton =
      document.createElement(
        "button"
      );


      xShareButton.className =
      "share-button x-share-button";


      xShareButton.textContent =
      "𝕏 Xでみんなに聞く";


      xShareButton.addEventListener(
        "click",
        () => {

          const xUrl =
          "https://twitter.com/intent/tweet?text=" +
          encodeURIComponent(
            shareText
          ) +
          "&url=" +
          encodeURIComponent(
            topicUrl
          );


          window.open(
            xUrl,
            "_blank",
            "noopener,noreferrer"
          );

        }
      );


      const shareButton =
      document.createElement(
        "button"
      );


      shareButton.className =
      "share-button";


      shareButton.textContent =
      "🔗 URLをコピー";


      shareButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              topicUrl
            );


            shareButton.textContent =
            "✅ コピーしました";


            setTimeout(
              () => {

                shareButton.textContent =
                "🔗 URLをコピー";

              },
              1800
            );

          }
          catch(error) {

            alert(
              topicUrl
            );

          }

        }
      );


      shareArea.appendChild(
        shareTitle
      );


      shareArea.appendChild(
        xShareButton
      );


      shareArea.appendChild(
        shareButton
      );


      card.appendChild(
        shareArea
      );

    }
    else {

      const hint =
      document.createElement(
        "div"
      );


      hint.className =
      "open-hint";


      hint.textContent =
      "▼ 議題を押して詳しく見る";


      hint.addEventListener(
        "click",
        () => {

          openTopic(
            topic.id
          );

        }
      );


      card.appendChild(
        hint
      );

    }


    topicsElement.appendChild(
      card
    );

  });

}



async function vote(
  topicId,
  side
) {

  try {

    await addDoc(

      collection(

        db,

        "topics",

        topicId,

        "votes"

      ),

      {

        side,

        createdAt:
        serverTimestamp()

      }

    );

  }
  catch(error) {

    console.error(
      error
    );


    alert(
      "投票できませんでした。"
    );

  }

}



function buildDiscussionArea(
  area,
  topic
) {

  const heading =
  document.createElement(
    "h3"
  );


  heading.textContent =
  "意見を書く";


  let selectedSide =
  "";


  const sideButtons =
  document.createElement(
    "div"
  );


  sideButtons.className =
  "side-buttons";


  const agree =
  document.createElement(
    "button"
  );


  agree.className =
  "side-button";


  agree.textContent =
  "👍 賛成";


  const disagree =
  document.createElement(
    "button"
  );


  disagree.className =
  "side-button";


  disagree.textContent =
  "👎 反対";


  agree.addEventListener(
    "click",
    () => {

      selectedSide =
      "agree";


      agree.classList.add(
        "selected"
      );


      disagree.classList.remove(
        "selected"
      );

    }
  );


  disagree.addEventListener(
    "click",
    () => {

      selectedSide =
      "disagree";


      disagree.classList.add(
        "selected"
      );


      agree.classList.remove(
        "selected"
      );

    }
  );


  sideButtons.appendChild(
    agree
  );


  sideButtons.appendChild(
    disagree
  );


  const textarea =
  document.createElement(
    "textarea"
  );


  textarea.maxLength =
  500;


  textarea.placeholder =
  "あなたの意見を書いてください";


  const post =
  document.createElement(
    "button"
  );


  post.className =
  "post-button";


  post.textContent =
  "投稿する";


  const message =
  document.createElement(
    "div"
  );


  message.className =
  "message";


  post.addEventListener(
    "click",
    async () => {


      const text =
      textarea
      .value
      .trim();


      if (!selectedSide) {

        alert(
          "賛成か反対を選んでください"
        );

        return;

      }


      if (!text) {

        alert(
          "意見を書いてください"
        );

        return;

      }


      post.disabled =
      true;


      message.textContent =
      "投稿中...";


      try {

        await addDoc(

          collection(

            db,

            "topics",

            topic.id,

            "comments"

          ),

          {

            text,

            side:
            selectedSide,

            createdAt:
            serverTimestamp()

          }

        );


        textarea.value =
        "";


        selectedSide =
        "";


        agree.classList.remove(
          "selected"
        );


        disagree.classList.remove(
          "selected"
        );


        message.textContent =
        "投稿しました！";

      }
      catch(error) {

        console.error(
          error
        );


        message.textContent =
        "投稿できませんでした。";

      }
      finally {

        post.disabled =
        false;

      }

    }
  );


  area.appendChild(
    heading
  );


  area.appendChild(
    sideButtons
  );


  area.appendChild(
    textarea
  );


  area.appendChild(
    post
  );


  area.appendChild(
    message
  );

}


</script>


</body>

</html>
