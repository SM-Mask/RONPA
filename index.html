  const params =
  new URLSearchParams(
    window.location.search

  );

}

function getOrCreateVisitorId() {

  let id =
  localStorage.getItem(
    "ronpa_visitor_id"
  );

  if (!id) {

    if (
      window.crypto &&
      typeof window.crypto.randomUUID === "function"
    ) {

      id =
      window.crypto
      .randomUUID()
      .replaceAll("-", "")
      .slice(0, 10)
      .toUpperCase();

    } else {

      id =
      Math.random()
      .toString(36)
      .slice(2, 12)
      .toUpperCase();

    }

    localStorage.setItem(
      "ronpa_visitor_id",
      id
    );

  }

  return id;

}


function getDeviceLabel() {

  const ua =
  navigator.userAgent || "";

  if (/iPad|Tablet/i.test(ua)) {
    return "タブレット";
  }

  if (/Mobi|Android|iPhone/i.test(ua)) {
    return "スマホ";
  }

  return "PC";

}


function getBrowserLabel() {

  const ua =
  navigator.userAgent || "";

  if (/Edg\//.test(ua)) {
    return "Edge";
  }

  if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) {
    return "Chrome";
  }

  if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) {
    return "Safari";
  }

  if (/Firefox\//.test(ua)) {
    return "Firefox";
  }

  return "その他";

}

function formatVisitTime(
  timestamp
) {

  if (
    !timestamp ||
    typeof timestamp.toDate !== "function"
  ) {
    return "記録中...";
  }

  return timestamp
  .toDate()
  .toLocaleString(
    "ja-JP"
  );

}


function stopVisitorLog() {

  if (visitorLogUnsubscribe) {

    visitorLogUnsubscribe();
    visitorLogUnsubscribe =
    null;

  }

  adminVisitorList.innerHTML =
  "";

  adminVisitorSummary.textContent =
  "";

function startVisitorLog() {

  stopVisitorLog();

  if (!isAdmin) {
    return;
  }

  adminVisitorSummary.textContent =
  "読み込み中...";

  const visitQuery =
  query(
    collection(
      db,
      "topics",
      "__site_analytics__",
      "votes"
    ),
    orderBy(
      "createdAt",
      "desc"
    ),
    limit(50)
  );

  visitorLogUnsubscribe =
  onSnapshot(
    visitQuery,
    snapshot => {

      const visits =
      [];

      snapshot.forEach(
        docSnap => {

          const data =
          docSnap.data();

          if (
            data.eventType ===
            "siteVisit"
          ) {

            visits.push(
              data
            );

          }

        }
      );

      const uniqueVisitors =
      new Set(
        visits
        .map(
          visit =>
          visit.visitorId
        )
        .filter(Boolean)
      );

      adminVisitorSummary.textContent =
      `最新 ${visits.length} 件 / 匿名訪問者 ${uniqueVisitors.size} 人`;

      adminVisitorList.innerHTML =
      "";

      if (
        visits.length ===
        0
      ) {

        const empty =
        document.createElement(
          "div"
        );

        empty.className =
        "empty";

        empty.textContent =
        "まだ訪問記録はありません。";

        adminVisitorList.appendChild(
          empty
        );

        return;

      }

      visits.forEach(
        visit => {

          const item =
          document.createElement(
            "div"
          );

          item.className =
          "admin-visitor-item";

          const id =
          document.createElement(
            "div"
          );

          id.className =
          "admin-visitor-id";

          id.textContent =
          `匿名ID: ${visit.visitorId || "不明"}`;

          const meta =
          document.createElement(
            "div"
          );

          meta.className =
          "admin-visitor-meta";

          meta.textContent =
          `${formatVisitTime(visit.createdAt)} / ${visit.device || "不明"} / ${visit.browser || "不明"} / ${visit.page || "不明"}`;

          item.appendChild(
            id
          );

          item.appendChild(
            meta
          );

          adminVisitorList.appendChild(
            item
          );

        }
      );

    },
    error => {

      console.error(
        "訪問ログの読み込みに失敗しました",
        error
      );

      adminVisitorSummary.textContent =
      "訪問ログを読み込めませんでした。";

    }
  );

}

onSnapshot(

collection(
  db,
  "topics"
),

snapshot => {


  const currentIds =
  new Set();


  snapshot.forEach(
  topicDoc => {


    const id =
    topicDoc.id;


    const data =
    topicDoc.data();


    currentIds.add(
      id
    );


    if (
      !topicData.has(
        id
      )
    ) {

      topicData.set(

        id,

        {

          id,

          title:
          data.title,

          createdAt:
          data.createdAt,

          views:
          data.views || 0,

          baseViews:
          data.views || 0,

          viewEvents:
          0,

          agree:
          0,

          disagree:
          0,

          comments:
          []

        }

      );


      watchVotes(
        id
      );


      watchComments(
        id
      );

    }
    else {

      const topic =
      topicData.get(
        id
      );


      topic.title =
      data.title;


      topic.createdAt =
      data.createdAt;


      topic.baseViews =
      data.views || 0;


      topic.views =
      topic.baseViews + (topic.viewEvents || 0);

    }

  });


  for (
    const id
    of topicData.keys()
  ) {

    if (
      !currentIds.has(
        id
      )
    ) {

      topicData.delete(
        id
      );

    }

  }


  renderTopics();

});

function watchVotes(
  topicId
) {

  if (
    voteUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const unsubscribe =
  onSnapshot(

    collection(

      db,

      "topics",

      topicId,

      "votes"

    ),

    snapshot => {


      let agree =
      0;


      let disagree =
      0;


      const badCounts =
      {};


      let viewEvents =
      0;


      snapshot.forEach(
      voteDoc => {


        const vote =
        voteDoc.data();


        if (vote.eventType === "view") {

          viewEvents++;
          return;

        }


        if (vote.eventType === "bad" && vote.commentId) {

          badCounts[vote.commentId] =
          (badCounts[vote.commentId] || 0) + 1;
          return;

        }


        if (
          vote.side ===
          "agree"
        ) {

          agree++;

        }


        if (
          vote.side ===
          "disagree"
        ) {

          disagree++;

        }

      });


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) {

        return;

      }


      topic.agree =
      agree;


      topic.disagree =
      disagree;


      topic.badCounts =
      badCounts;


      topic.viewEvents =
      viewEvents;


      topic.views =
      (topic.baseViews || 0) + viewEvents;


      renderTopics();

    }

  );


  voteUnsubscribers.set(
    topicId,
    unsubscribe
  );

}



function watchComments(
  topicId
) {

  if (
    commentUnsubscribers.has(
      topicId
    )
  ) {

    return;

  }


  const commentsQuery =
  query(

    collection(

      db,

      "topics",

      topicId,

      "comments"

    ),

    orderBy(
      "createdAt",
      "desc"
    )

  );


  const unsubscribe =
  onSnapshot(

    commentsQuery,

    snapshot => {


      const allEntries =
      [];


      snapshot.forEach(
      commentDoc => {

        allEntries.push({
          id: commentDoc.id,
          ...commentDoc.data()
        });

      });


      const removedIds =
      new Set(
        allEntries
          .filter(entry => entry.eventType === "remove" && entry.targetCommentId)
          .map(entry => entry.targetCommentId)
      );


      const comments =
      allEntries.filter(entry =>
        entry.eventType !== "remove" &&
        !removedIds.has(entry.id)
      );


      const topic =
      topicData.get(
        topicId
      );


      if (!topic) {

        return;

      }


      topic.comments =
      comments;


      renderTopics();

    }

  );


  commentUnsubscribers.set(
    topicId,
    unsubscribe
  );

}

        agreeBar
      );


      quickBar.appendChild(
        disagreeBar
      );


      quickPoll.appendChild(
        quickQuestion
      );


      quickPoll.appendChild(
        quickResult
      );


      quickPoll.appendChild(
        quickBar
      );


      quickPoll.appendChild(
        quickNote
      );


      card.appendChild(
        quickPoll
      );

    }


    card.appendChild(
      voteRow
    );


    card.appendChild(
      latestTitle
    );


    card.appendChild(
      latestArea
    );


    if (
      routeTopicId
    ) {

      const discussion =
      document.createElement(
        "div"
      );


      discussion.className =
      "discussion-area open";


      buildDiscussionArea(
        discussion,
        topic
      );


      card.appendChild(
        discussion
      );


      const shareArea =
      document.createElement(
        "div"
      );


      shareArea.className =
      "share-area";


      const shareTitle =
      document.createElement(
        "p"
      );


      shareTitle.className =
      "share-title";


      shareTitle.textContent =
      "この議題をみんなに聞いてみよう";


      const topicUrl =
      `${BASE_URL}?topic=${encodeURIComponent(topic.id)}`;


      const shareText =
      `「${topic.title}」\nあなたは賛成？反対？\n👍 賛成 ${topic.agree} / 👎 反対 ${topic.disagree}\n#RONPA`;


      const xShareButton =
      document.createElement(
        "button"
      );


      xShareButton.className =
      "share-button x-share-button";


      xShareButton.textContent =
      "Xでみんなに聞く";


      xShareButton.addEventListener(
        "click",
        () => {

          const xUrl =
          "https://twitter.com/intent/tweet?text=" +
          encodeURIComponent(
            shareText
          ) +
          "&url=" +
          encodeURIComponent(
            topicUrl
          );


          window.open(
            xUrl,
            "_blank",
            "noopener,noreferrer"
          );

        }
      );


      const shareButton =
      document.createElement(
        "button"
      );


      shareButton.className =
      "share-button";


      shareButton.textContent =
      "🔗 URLをコピー";


      shareButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              topicUrl
            );


            shareButton.textContent =
            "✅ コピーしました";


            setTimeout(
              () => {

                shareButton.textContent =
                "🔗 URLをコピー";

              },
              1800
            );

          }
          catch(error) {

            alert(
              topicUrl
            );

          }

        }
      );


      shareArea.appendChild(
        shareTitle
      );


      shareArea.appendChild(
        xShareButton
      );


      shareArea.appendChild(
        shareButton
      );


      card.appendChild(
        shareArea
      );


      const relatedTopics =
      Array.from(
        topicData.values()
      )
      .filter(
        item =>
        item.id !==
        topic.id
      )
      .sort(
        (a, b) => {

          const scoreA =
          a.agree +
          a.disagree +
          a.comments.length * 3;

          const scoreB =
          b.agree +
          b.disagree +
          b.comments.length * 3;

          return scoreB - scoreA;

        }
      )
      .slice(
        0,
        3
      );


      if (
        relatedTopics.length >
        0
      ) {

        const relatedArea =
        document.createElement(
          "div"
        );


        relatedArea.className =
        "related-area";


        const relatedTitle =
        document.createElement(
          "p"
        );


        relatedTitle.className =
        "related-title";


        relatedTitle.textContent =
        "こんな議論もあります";


        relatedArea.appendChild(
          relatedTitle
        );


        relatedTopics.forEach(
        related => {

          const relatedButton =
          document.createElement(
            "button"
          );


          relatedButton.className =
          "related-topic";


          relatedButton.textContent =
          `💬 ${related.title}`;


          relatedButton.addEventListener(
            "click",
            () => {

              openTopic(
                related.id
              );

            }
          );


          relatedArea.appendChild(
            relatedButton
          );

        });


        card.appendChild(
          relatedArea
        );

      }

    }
    else {

      const hint =
      document.createElement(
        "button"
      );


      hint.type =
      "button";


      hint.className =
      "open-hint";


      hint.textContent =
      "議題を詳しく見る →";


      hint.addEventListener(
        "click",
        () => {

          openTopic(
            topic.id
          );

        }
      );


      card.appendChild(
        hint
      );

    }


    topicsElement.appendChild(
      card
    );

  });

}



function showSharePrompt(
  topicId,
  actionText
) {

  const oldToast =
  document.getElementById(
    "shareToast"
  );


  if (oldToast) {
    oldToast.remove();
  }


  const topic =
  topicData.get(
    topicId
  );


  if (!topic) {
    return;
  }


  const topicUrl =
  `${BASE_URL}?topic=${encodeURIComponent(topicId)}`;


  const shareText =
  `「${topic.title}」\nあなたは賛成？反対？\nRONPAで投票してみて👇\n#RONPA`;


  const toast =
  document.createElement(
    "div"
  );


  toast.id =
  "shareToast";


  toast.className =
  "share-toast";


  const title =
  document.createElement(
    "div"
  );


  title.className =
  "share-toast-title";


  title.textContent =
  `${actionText}！みんなにも聞いてみる？`;


  const text =
  document.createElement(
    "div"
  );


  text.className =
  "share-toast-text";


  text.textContent =
  "共有すると、この議題に新しい意見が集まりやすくなります。";


  const buttons =
  document.createElement(
    "div"
  );


  buttons.className =
  "share-toast-buttons";


  const xButton =
  document.createElement(
    "button"
  );


  xButton.className =
  "share-now";


  xButton.textContent =
  "Xで共有";


  xButton.addEventListener(
    "click",
    () => {

      const xUrl =
      "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(
        shareText
      ) +
      "&url=" +
      encodeURIComponent(
        topicUrl
      );


      window.open(
        xUrl,
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


  const copyButton =
  document.createElement(
    "button"
  );


  copyButton.textContent =
  "🔗 URLコピー";


  copyButton.addEventListener(
    "click",
    async () => {

      try {

        await navigator.clipboard.writeText(
          topicUrl
        );


        copyButton.textContent =
        "✅ コピー済み";

      }
      catch(error) {

        alert(
          topicUrl
        );

      }

    }
  );


  const closeButton =
  document.createElement(
    "button"
  );


  closeButton.className =
  "share-toast-close";


  closeButton.textContent =
  "今はしない";


  closeButton.addEventListener(
    "click",
    () => {

      toast.remove();

    }
  );


  buttons.appendChild(
    xButton
  );


  buttons.appendChild(
    copyButton
  );


  toast.appendChild(
    title
  );


  toast.appendChild(
    text
  );


  toast.appendChild(
    buttons
  );


  toast.appendChild(
    closeButton
  );


  document.body.appendChild(
    toast
  );


  setTimeout(
    () => {

      if (toast.isConnected) {
        toast.remove();
      }

    },
    12000
  );

}

async function deleteCommentAsAdmin(
  topicId,
  commentId
) {

  if (!isAdmin) {
    alert("管理者モードではありません。");
    return;
  }

  const ok =
  confirm("このコメントを排除しますか？\nサイト上から非表示になります。");

  if (!ok) {
    return;
  }

  try {

    // delete権限に依存せず、通常コメントと同じ追加権限で非表示マーカーを保存。
    await addDoc(
      collection(
        db,
        "topics",
        topicId,
        "comments"
      ),
      {
        side: "agree",
        text: "[管理者により非表示]",
        eventType: "remove",
        targetCommentId: commentId,
        createdAt: serverTimestamp()
      }
    );

  }
  catch(error) {

    console.error(error);
    alert("コメントを排除できませんでした。");

  }

}

function buildDiscussionArea(
  area,
  topic
) {

  const heading =
  document.createElement(
    "h3"
  );


  heading.textContent =
  "意見を書く";


  let selectedSide =
  "";


  const sideButtons =
  document.createElement(
    "div"
  );


  sideButtons.className =
  "side-buttons";


  const agree =
  document.createElement(
    "button"
  );


  agree.className =
  "side-button";


  agree.textContent =
  "👍 賛成";


  const disagree =
  document.createElement(
    "button"
  );


  disagree.className =
  "side-button";


  disagree.textContent =
  "👎 反対";


  agree.addEventListener(
    "click",
    () => {

      selectedSide =
      "agree";


      agree.classList.add(
        "selected"
      );


      disagree.classList.remove(
        "selected"
      );

    }
  );


  disagree.addEventListener(
    "click",
    () => {

      selectedSide =
      "disagree";


      disagree.classList.add(
        "selected"
      );


      agree.classList.remove(
        "selected"
      );

    }
  );


  sideButtons.appendChild(
    agree
  );


  sideButtons.appendChild(
    disagree
  );


  const textarea =
  document.createElement(
    "textarea"
  );


  textarea.maxLength =
  500;


  textarea.placeholder =
  "あなたの意見を書いてください";


  const post =
  document.createElement(
    "button"
  );


  post.className =
  "post-button";


  post.textContent =
  "投稿する";


  const message =
  document.createElement(
    "div"
  );


  message.className =
  "message";


  post.addEventListener(
    "click",
    async () => {


      const text =
      textarea
      .value
      .trim();


      if (!selectedSide) {

        alert(
          "賛成か反対を選んでください"
        );

        return;

      }


      if (!text) {

        alert(
          "意見を書いてください"
        );

        return;

      }


      post.disabled =
      true;


      message.textContent =
      "投稿中...";


      try {

        await addDoc(

          collection(

            db,

            "topics",

            topic.id,

            "comments"

          ),

          {

            text,

            side:
            selectedSide,

            helpful:
            0,

            notHelpful:
            0,

            createdAt:
            serverTimestamp()

          }

        );


        textarea.value =
        "";


        selectedSide =
        "";


        agree.classList.remove(
          "selected"
        );


        disagree.classList.remove(
          "selected"
        );


        message.textContent =
        "投稿しました！";


      }
      catch(error) {

        console.error(
          error
        );


        message.textContent =
        "投稿できませんでした。";

      }
      finally {

        post.disabled =
        false;

      }

    }
  );


  area.appendChild(
    heading
  );


  area.appendChild(
    sideButtons
  );


  area.appendChild(
    textarea
  );


  area.appendChild(
    post
  );


  area.appendChild(
    message
  );

}


</script>
